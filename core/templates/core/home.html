<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Smart Authentication Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <nav class="bg-slate-800 border-b border-slate-700 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-indigo-400">⚡ SMART-AUTH SYSTEM</h1>
            <a href="{% url 'start_scanner' %}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-semibold transition shadow-lg shadow-emerald-900/30">
                📸 Lancer le Scanner Vidéo
            </a>
        </div>
    </nav>

    <main class="container mx-auto mt-10 p-4">
        <h2 class="text-2xl font-bold mb-6">Membres du Système</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {% for u in users %}
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-xl flex flex-col justify-between">
                <div>
                    <div class="w-12 h-12 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold text-lg mb-4">
                        {{ u.user.username|slice:":2"|upper }}
                    </div>
                    <h3 class="text-xl font-semibold mb-1">{{ u.user.username }}</h3>
                    <p class="text-slate-400 text-sm mb-4">{{ u.user.email }}</p>
                </div>
                <a href="{% url 'generate_qr_view' u.id %}" class="block text-center bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-lg font-medium transition">
                    🔑 Générer un Pass QR Sûr
                </a>
            </div>
            {% empty %}
            <p class="text-slate-500 col-span-3">Aucun profil utilisateur trouvé en base de données.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
