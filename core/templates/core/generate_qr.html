<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Votre Pass d'Accès</title>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
        <h2 class="text-2xl font-bold text-slate-200">Pass d'Accès Unique</h2>
        <p class="text-indigo-400 text-sm mt-1 font-medium mb-6">Utilisateur: {{ user_prof.user.username }}</p>
        
        <div class="bg-white p-4 rounded-xl inline-block shadow-inner mb-6">
            {% load static %}
            <img src="{% static qr_path %}" alt="QR Code" class="w-48 h-48">
        </div>

        <div class="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 text-xs text-amber-400 mb-6">
            ⚠️ Ce pass est à <strong>usage unique</strong> et expirera automatiquement dans <strong>5 minutes</strong>.
        </div>

        <a href="{% url 'home' %}" class="text-slate-400 hover:text-white text-sm font-medium transition">
            ← Retour au tableau de bord
        </a>
    </div>
</body>
</html>
